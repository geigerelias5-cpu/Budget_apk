name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK kompilieren
        env:
          BUDGET_KEY_PASSWORD: ${{ secrets.BUDGET_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Budget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Budget-APK
          path: Budget.apk

      - name: Als Release veröffentlichen (direkter Download-Link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName '\\K[^']+" app/build.gradle)
          gh release create "v${VERSION}-${{ github.run_number }}" Budget.apk \
            --title "Budget ${VERSION}" \
            --notes "**Installieren:** Budget.apk auf dem Android-Handy herunterladen, antippen und „Installieren“ wählen (einmalig „Unbekannte Apps installieren“ erlauben). Android 10 oder neuer." \
            --latest
