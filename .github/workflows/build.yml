name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK kompilieren
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Budget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Budget-APK
          path: Budget.apk

      - name: Als Release veröffentlichen (direkter Download-Link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Budget.apk \
            --title "Budget App (Build ${{ github.run_number }})" \
            --notes "Auf dem Handy Budget.apk antippen und installieren." \
            --latest
