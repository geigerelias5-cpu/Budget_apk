plugins {
    id 'com.android.application'
}

android {
    namespace 'de.budget.tracker'
    compileSdk 35

    defaultConfig {
        applicationId 'de.budget.tracker'
        minSdk 29
        targetSdk 34
        versionCode 25
        versionName '3.1'
    }

    signingConfigs {
        // Schlüsseldatei liegt im Projekt, das Passwort NUR als GitHub-Secret „BUDGET_KEY_PASSWORD“.
        // So kann niemand mit dem öffentlichen Code gefälschte Updates signieren.
        budget {
            storeFile file('budget-release.p12')
            storePassword System.getenv('BUDGET_KEY_PASSWORD') ?: ''
            keyAlias 'budget'
            keyPassword System.getenv('BUDGET_KEY_PASSWORD') ?: ''
        }
    }

    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !System.getenv('BUDGET_KEY_PASSWORD')) {
            throw new GradleException('Das Secret BUDGET_KEY_PASSWORD fehlt (GitHub: Settings → Secrets and variables → Actions).')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.budget
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
