<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ausgabe eintragen</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--red:#d71921;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:transparent;color:#f2f2f2;font:16px/1.5 Hanken,system-ui,sans-serif;overflow:hidden;user-select:none}
.dim{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .35s}
.open .dim{opacity:.5}
.sheet{position:fixed;left:10px;right:10px;bottom:10px;background:#000;border:1px solid #ffffff17;border-radius:30px;padding:16px 16px 14px;
 transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.9,.2,1);box-shadow:0 -10px 50px -10px #000}
.open .sheet{transform:none}
.hd{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#8a8a8a;padding:0 4px}
.hd b{font:900 17px Doto,monospace;color:#f2f2f2;transition:color .3s}
.hd b.neg{color:var(--red)}
.amt{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;padding:10px 6px 6px;height:76px;overflow:hidden}
.amt .v{font:900 52px/1 Doto,monospace;white-space:nowrap}
.amt .v.ph{color:#3a3a3a}
.amt .u{font:900 30px Doto,monospace;color:#555}
.amt.shake{animation:shake .35s}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 12px}
.cats.shake{animation:shake .35s}
.cat{border:1px solid #ffffff1c;background:#111;border-radius:99px;height:40px;font:500 13px Hanken,sans-serif;color:#cfcfcf;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s,color .2s,border-color .2s,transform .15s}
.cat i{width:7px;height:7px;border-radius:50%;flex:none}
.cat[aria-pressed=true]{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pad button{height:56px;border:0;border-radius:18px;background:#141414;color:#f2f2f2;font:900 26px Doto,monospace;transition:background .15s,transform .12s}
.pad button:active{background:#262626;transform:scale(.95)}
.pad .del{font:500 20px Hanken,sans-serif;color:#9a9a9a}
.row{display:flex;gap:8px;margin-top:10px}
.go{flex:1;height:56px;border:0;border-radius:18px;background:var(--red);color:#fff;font:700 16px Hanken,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,transform .15s}
.go:disabled{background:#1e1e1e;color:#555}
.go.ok{background:#f2f2f2;color:#000}
.app{width:56px;height:56px;border:1px solid #ffffff1c;border-radius:18px;background:none;color:#cfcfcf;display:grid;place-items:center;transition:transform .15s}
.app:active,.go:active:not(:disabled){transform:scale(.95)}
.nob{text-align:center;padding:10px 6px 4px}
.nob p{color:#9a9a9a;margin:6px 0 14px}
.nob .go{width:100%}
.ns{position:fixed;left:10px;right:10px;bottom:10px;background:#0a0a0a;color:#f2f2f2;border:1px solid #ffffff24;border-radius:30px;padding:18px 16px 14px;transform:translateY(115%);transition:transform .45s cubic-bezier(.2,.9,.2,1);box-shadow:0 -20px 40px -10px #000;z-index:5}
.ns.on{transform:none}
.ns h4{margin:0 0 2px;font-size:18px}.ns p{margin:0 0 12px;font-size:13px;color:#8a8a8a}
.ns input{width:100%;height:52px;border:1px solid #ffffff24;border-radius:16px;background:#141414;color:#f2f2f2;font:500 17px Hanken,sans-serif;padding:0 16px;user-select:text}
.ns input:focus{outline:none;border-color:#f2f2f2}
.ns .r2{display:flex;gap:8px;margin-top:12px}
.ns .r2 button{flex:1;height:52px;border-radius:18px;border:0;font:700 15px Hanken,sans-serif}
.ns .ok2{background:var(--red);color:#fff}.ns .no2{background:#141414;color:#cfcfcf;flex:0 0 38%!important}
.cat .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cat{min-width:0;padding:0 4px;font-size:12px;gap:5px}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
.amt .v.bump{animation:popIn .18s ease-out}
button:focus{outline:none}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Ausgabe eintragen">
  <div id="form">
    <div class="hd"><span>Ausgabe eintragen</span><span>übrig <b id="left">–</b></span></div>
    <div class="amt" id="amt"><span class="v ph" id="val">0,00</span><span class="u">€</span></div>
    <div class="cats" id="cats" role="group" aria-label="Kategorie"></div>
    <div class="pad" id="pad"></div>
    <div class="row">
      <button class="app" id="app" aria-label="App öffnen"><svg width="22" height="22" viewBox="0 0 26 26"><circle cx="13" cy="13" r="9" fill="none" stroke="#cfcfcf" stroke-width="3.5" stroke-dasharray="38 19"/><circle cx="13" cy="13" r="9" fill="none" stroke="#d71921" stroke-width="3.5" stroke-dasharray="0 38 19 0"/></svg></button>
      <button class="go" id="go" disabled><span id="goT">Speichern</span></button>
    </div>
  </div>
  <div class="nob" id="nob" hidden>
    <b>Noch kein Budget</b>
    <p>Lege zuerst in der App dein Monatsbudget fest.</p>
    <button class="go" id="nobGo">App öffnen</button>
  </div>
</div>

<div class="ns" id="ns" role="dialog" aria-label="Notiz">
  <h4 id="nsT">Sonstiges – wofür?</h4>
  <p>Kurz notieren, damit du es später wiederfindest.</p>
  <input id="nsI" maxlength="40" placeholder="z. B. Geschenk für Lea" autocomplete="off" enterkeyhint="done">
  <div class="r2"><button class="no2" id="nsX">Abbrechen</button><button class="ok2" id="nsO">Übernehmen</button></div>
</div>
<script src="common.js"></script>
<script>
{
const $=id=>document.getElementById(id);
let S,s='',sel=null,busy=false,note='';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const catOf=id=>CATS.find(c=>c.id==id);
const isN=id=>!!(catOf(id)||{}).q;
let nsc=null,catSig='';
function buildCats(){const sig=JSON.stringify(CATS);if(sig===catSig)return;catSig=sig;
 $('cats').innerHTML=CATS.map(c=>`<button class="cat" data-c="${c.id}" aria-pressed="false"><i style="background:${wcol(c)}"></i>${esc(c.n)}</button>`).join('')}
$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','del','0',','].map(k=>k=='del'
 ?`<button class="del" data-k="del" aria-label="Löschen">⌫</button>`:`<button data-k="${k}">${k}</button>`).join('');

function selectCat(id){sel=catOf(id)?id:null;if(!isN(sel))note='';
 for(const b of $('cats').children){b.setAttribute('aria-pressed',b.dataset.c==sel);const c=catOf(b.dataset.c);
  if(c&&c.q)b.innerHTML=`<i style="background:${wcol(c)}"></i><span class="nt">${note&&sel==c.id?esc(note):esc(c.n)}</span>`}}
function openN(id){nsc=id||sel;$('nsT').textContent=(catOf(nsc)||{n:''}).n+' – wofür?';$('nsI').value=sel==nsc?note:'';$('ns').classList.add('on');setTimeout(()=>$('nsI').focus(),350)}
function closeN(){$('ns').classList.remove('on');$('nsI').blur()}
$('nsO').onclick=()=>{note=$('nsI').value.trim();sel=nsc;selectCat(nsc);closeN()};
$('nsX').onclick=()=>{closeN();if(!note&&isN(sel))selectCat(null)};
$('nsI').addEventListener('keydown',e=>{if(e.key=='Enter'){e.preventDefault();e.stopPropagation();$('nsO').click()}});
function upd(bump){const v=$('val');
 if(!s){v.textContent='0,00';v.classList.add('ph')}else{v.classList.remove('ph');
  const [a,b]=s.split(',');v.textContent=Number(a||'0').toLocaleString('de-DE')+(b!==undefined?','+b:'')}
 if(bump){v.classList.remove('bump');void v.offsetWidth;v.classList.add('bump')}
 $('go').disabled=!(num(s)>0)}
function leftNow(){const tot=S.entries.filter(inMonth).reduce((a,e)=>a+e.amt,0)+fixedPending(S);return S.budget-tot}
function showLeft(){const l=leftNow(),b=$('left');b.textContent=eur0(l);b.classList.toggle('neg',l<0)}

$('cats').addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;selectCat(b.dataset.c);if(isN(b.dataset.c))openN(b.dataset.c)});
$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;const k=b.dataset.k;
 if(k=='del')s=s.slice(0,-1);
 else if(k==','){if(!s.includes(','))s=(s||'0')+','}
 else{const [a,c]=s.split(',');
  if(c!==undefined){if(c.length>=2)return;s+=k}
  else{if((a||'').length>=6)return;s=(s=='0'?'':s)+k}}
 upd(true)});

function shake(id){const el=$(id);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
$('go').onclick=()=>{if(busy)return;const v=num(s);if(!(v>0))return shake('amt');if(!sel)return shake('cats');
 busy=true;S=loadState();const en={id:newId(),amt:v,cat:sel,ts:Date.now()};if(isN(sel)&&note)en.note=note;S.entries.push(en);saveState(S);showLeft();
 $('go').classList.add('ok');$('goT').textContent='✓ Gespeichert';
 setTimeout(()=>dismiss(),650)};

$('app').onclick=()=>{if(NATIVE)Android.openApp()};
$('nobGo').onclick=()=>{if(NATIVE)Android.openApp()};
$('dim').onclick=()=>dismiss();

window.dismiss=()=>{if($('ns').classList.contains('on')){$('nsX').click();return true}document.body.classList.remove('open');setTimeout(()=>{if(NATIVE)Android.close()},380);return true};
window.reopen=()=>{S=loadState();buildCats();s='';busy=false;note='';closeN();
 $('go').classList.remove('ok');$('goT').textContent='Speichern';
 const has=S.budget>0;$('form').hidden=!has;$('nob').hidden=has;
 const sc=NATIVE?Android.startCategory():'';selectCat(sc);upd(false);if(has)showLeft();if(has&&isN(sc))setTimeout(()=>openN(sc),400);
 document.body.classList.remove('open');void document.body.offsetWidth;
 requestAnimationFrame(()=>document.body.classList.add('open'))};

/* Tastatur am Computer (zum Testen) */
document.addEventListener('keydown',e=>{if($('ns').classList.contains('on'))return;const m={Backspace:'del',',':',','.':','};const k=m[e.key]||(/^[0-9]$/.test(e.key)?e.key:null);
 if(k){const b=$('pad').querySelector(`[data-k="${k}"]`);b&&b.click()}else if(e.key=='Enter')$('go').click();else if(e.key=='Escape')dismiss()});

reopen();
}
</script>
</body>
</html>
